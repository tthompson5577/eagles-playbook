<script>
'use strict';
/* =====================================================================
   CONTENT (plain data). Add plays and quiz questions here.
   Court is in FEET: x = -25 (left sideline) .. 25 (right sideline),

   Offense players are "1".."5"; defenders are "x1".."x5".
   Actions in a step:
     P(from, to)        pass                (dashed arrow)
     H(from, to)        dribble handoff

const H=(f,to)=>({t:'hand',f:String(f),to:String(to)});

const SERIES=['All','Rules','Low','Point','5 Out'];

const TRANS_RULES=[
  ['The first option: no defense between you and the basket? Run to the rim for a dunk.','If we beat everyone down the floor, we score right away. The rules below are for when we do not have that.'],
  ['The post is always the rim runner.','Whether she gets the rebound and outlets, or someone else gets the rebound.'],
  ['The other four run to the wings and slots.',''],

  ['Everyone ahead of the ball: eyes on the ball.','Get wide, with a good angle for the pass.'],
  ['The first girl down on each side goes to the wing.','Never inside the three point line.'],
  ['Three of us on the same side? The first one down keeps running.','She goes through the middle of the paint to the opposite corner, then fills back up to that wing. If there is already a wing on that side, she pushes her up to the slot. Fill the open spot.'],
  ['Kick it up the sideline as quick as we can.','The ideal pass is wing to wing on the same side of the court.'],
  ['Good, quick, open shot at any point? Take it.','No quick shot? These rules have set us up to get right into our Motion offense.']
];
const RULES=[
  ['Overplayed? Backcut.','Step up, plant, go to the rim. Bounce pass on every backdoor.'],
  ['Dribble at you = handoff or backcut.','Defender trailing = come get the handoff. Defender jumping it = backcut. Never stand still.'],
  ['Pass and move.','After you pass, cut or screen. Never stand and watch.'],

  ['Post feed on the block = cut off the post.','Split, Split Backcut, or Curl.'],
  ['Ball reversal = post flashes high.','High-post catch = Point. Duck in if her defender is behind her. If the ball moves too fast, she goes block to block and flashes on the next reversal. The offense never stops.'],
  ['Ball at the high post = read Away or Over.','Away is our base. Ball-side wing denied = backdoor.'],

  ['Shots we want.','Layups, post catches in the paint, open 3s.'],

const PLAYS=[
 {id:'trans-primary',series:'Transition',stage:1,title:'Primary Break',sub:'Nobody between you and the basket? Dunk',view:'full94',
  start:Object.assign({},REB_G,{3:[-15,60]},{x1:[-6,71],x2:[9,77],x3:[-13,80],x4:[1,90],x5:[7,88]}),ball:'1',
  steps:[
   {cap:'1 rebounds. 3 already beat everyone down the floor: there is no defense between her and the basket.',a:[C(3,[-11,34],[-16,48]),C('x1',[-5,62]),C('x3',[-12,70])]},

 {id:'trans-post-outlet',series:'Transition',stage:1,title:'Post Rebounds: Outlet and Run',sub:'Outlet to the wing, kick it up the sideline',view:'full94',
  start:with_(REB,{4:[-4,79],5:[3,85]}),ball:'5',
  steps:[
   {cap:'5, our post, gets the rebound and outlets to a guard at the wing: 1. Then she sprints the middle. She is still the rim runner. 3 and 2, first down each side, sprint to the wings, eyes on the ball.',
    a:[P(5,1),C(5,[0,54],[2,72]),C(3,[-21.5,47],[-20,63]),C(2,[21.5,50],[20,63]),C(4,[6,68])]},

 {id:'trans-three-side',series:'Transition',stage:1,title:'Three on One Side',sub:'First one down keeps running to the opposite corner',view:'full94',

 {id:'low-transition',series:'Transition',stage:1,title:'Outlet and Kick Ahead',sub:'4 rebounds and outlets, 5 runs the rim',view:'full94',

/* 5-10 vs. their two common press breaks. We defend the TOP basket; they inbound under the bottom basket (baseline y = 94). */
(function(){
  const ALIGN={
    across:{name:'1-4 Across',sub:'Inbounder + four across',
      opp:{o1:[-3,96],o2:[-19,77],o3:[-6,78],o4:[6,78],o5:[19,77]},
      who:{1:'o3',2:'o4',3:'o2',4:'o5',5:'o1'},
      look:'They line up 1-4: the inbounder and four across near their free-throw line.'},
    diamond:{name:'Diamond (1-2-1-1)',sub:'Inbounder, two at the elbows, one middle, one deep',
      opp:{o1:[-3,96],o2:[-9,79],o3:[9,79],o4:[0,60],o5:[0,20]},
      who:{1:'o2',2:'o3',3:'o4',4:'o5',5:'o1'},
      look:'They line up in a diamond (1-2-1-1): the inbounder, two at the elbows, one in the middle, and one deep by our basket.'}
  };
  const WORD={5:'none of us are',6:'one is',7:'two are',8:'three are',9:'four are',10:'all five are'};
  const HALF=45;
  function deny(man,ball){const dx=ball[0]-man[0],dy=ball[1]-man[1],L=Math.hypot(dx,dy)||1;return [Math.round((man[0]+dx/L*3.3)*10)/10,Math.round((man[1]+dy/L*3.3)*10)/10];}
  function list(a){return a.length===1?a[0]:a.slice(0,-1).join(', ')+' and '+a[a.length-1];}
  Object.keys(ALIGN).forEach(key=>{
    const A=ALIGN[key];
    for(let n=5;n<=10;n++){
      const k=n-5,up=['1','2','3','4','5'].slice(0,k),pos=Object.assign({},A.opp),wait=[];
      ['1','2','3','4','5'].forEach(p=>{
        const man=A.opp[A.who[p]];
        if(up.indexOf(p)>=0){
          pos[p]=A.who[p]==='o1'?[man[0],man[1]-4]:deny(man,A.opp.o1);
        }else if(man[1]<HALF){            /* her player is already in our half (the deep player) */
          pos[p]=deny(man,A.opp.o1);
        }else{
          pos[p]=[Math.max(-22,Math.min(22,man[0])),HALF];wait.push(p);
        }
      });
      /* spread the half-court waiters evenly so nobody overlaps */
      wait.sort((x,y)=>A.opp[A.who[x]][0]-A.opp[A.who[y]][0]).forEach((p,i)=>{pos[p]=[Math.round((i-(wait.length-1)/2)*10),HALF];});
      const ws=wait.slice().sort();
      let cap;
      if(k===0)cap='5: nobody up turning. All five wait and pick up at half court.';
      else if(k===5)cap='10 = 5+5: all five up turning. 5 guards the inbounder (get a tip); everyone else denies, between her player and the ball.';
      else cap=n+' = 5+'+k+'. Up turning (example): '+list(up)+', denying between her player and the ball.'+(ws.length?' Waiting at half court: '+list(ws)+'.':'');
      if(key==='diamond'&&k<4)cap+=' Deep player: 4 guards her in our half.';
      PLAYS.push({id:'pb-'+key+'-'+n,series:String(n),title:n+' vs. '+A.name,sub:A.sub,view:'full94',start:pos,ball:'o1',
        steps:[{cap:cap,a:[]}],
        end:'Up turners deny full court. Everyone else picks up at half court. Then it is our man rules.'});
    }
  });
})();

/* f = {view,pos,ball,ballXY,you,arrows:[svg],marks:svg,under:svg} */
function courtSvg(f){
  const ids=Object.keys(f.pos);
  const defs=ids.filter(k=>k[0]==='x').map(k=>playerSvg(k,f.pos[k])).join('');
  const offs=ids.filter(k=>k[0]!=='x').map(k=>playerSvg(k,f.pos[k],!!f.you&&k===f.you)).join('');
  let bxy=f.ballXY;if(!bxy&&f.ball&&f.pos[f.ball])bxy=[f.pos[f.ball][0]+BALL_OFF[0],f.pos[f.ball][1]+BALL_OFF[1]];
  const ball=bxy?`<circle cx="${f2(bxy[0])}" cy="${f2(bxy[1])}" r=".85" fill="#ff7a1a" stroke="#5a2600" stroke-width=".15"/>`:'';
  return `<svg class="court${f.view==='full94'?' tall':''}" viewBox="${VIEWS[f.view||'half']}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Half-court diagram">${DEFS}${f.view==='full94'||f.view==='slob'?COURT_FULL:COURT}${f.under||''}${(f.arrows||[]).join('')}${defs}${offs}${ball}${f.marks||''}</svg>`;
}

/* animate one step from st; calls onFrame(frame) and done(en) */
let animId=0;
function animateStep(st,step,draw,done,dur){
  const my=++animId,en=applyStep(st,step),t0=performance.now();dur=dur||1150;
  const pa=step.a.find(a=>a.t==='pass'||a.t==='hand');
  const moves=step.a.filter(a=>a.t==='cut'||a.t==='drib'||a.t==='screen');
  function frame(now){
    if(my!==animId)return;
    const t=Math.min(1,(now-t0)/dur),e=ease(t),pos=copyPos(st.pos);
    moves.forEach(a=>{pos[a.p]=qpt(st.pos[a.p],a.to,a.t==='cut'?a.via:null,e);});
    let ballXY=null,ball=st.ball;
    if(pa){
      const bt=moves.length?clamp((e-.45)/.55,0,1):e;
      const A=pos[pa.f],B=pos[pa.to];
      ballXY=[A[0]+BALL_OFF[0]+(B[0]-A[0])*bt,A[1]+BALL_OFF[1]+(B[1]-A[1])*bt];ball=null;
    }
    draw({pos,ball,ballXY,arrows:step.a.map(a=>arrowSvg(a,st,en,{dim:true}))});
    if(t<1)requestAnimationFrame(frame);else done(en);
  }
  requestAnimationFrame(frame);
}
function animateSeq(st,steps,draw,done,gap){
  let i=0;
  (function next(s){
    if(i>=steps.length){done&&done(s);return;}
    const step=steps[i++];
    animateStep(s,step,draw,en=>{setTimeout(()=>{next(en);},gap==null?250:gap);});
  })(st);
}
function stopAnim(){animId++;}

function seriesStats(s){
  const pl=PLAYS.filter(p=>p.series===s),qs=QUIZ.filter(x=>x.series===s);
  const seen=pl.filter(p=>store.plays[p.id]).length,right=qs.filter(x=>store[x.kind][x.id]&&store[x.kind][x.id].last).length;
  return {plays:pl.length,seen,qs:qs.length,right,tot:pl.length+qs.length,got:seen+right};
}
function pct(st){return st.tot?Math.round(st.got/st.tot*100):0;}
function catStats(c){return catSeries(c).map(seriesStats).reduce((a,s)=>({tot:a.tot+s.tot,got:a.got+s.got}),{tot:0,got:0});}
function ring(p){return `<span class="ring" style="--p:${p}"><span>${p}%</span></span>`;}

/* ---------- home ---------- */
function myRank(){
  const b=store.board;if(!b||!store.player)return null;
  const act=b.players.filter(p=>p.reps>0).sort((a,c)=>c.reps-a.reps);
  const i=act.findIndex(isMe);
  return i<0?{reps:0}:{rank:i+1,reps:act[i].reps};
}
function homeView(){
  const first=store.player?store.player.name:'';
  const r=myRank(),focus=store.board&&store.board.focus;
  let out=`<div class="hello"><div><div class="stepno">Welcome back</div><h2>Hi${first?', '+esc(first):''}</h2></div>
    ${r?`<button class="rankchip" data-act="tab" data-k="team">${r.rank?'#'+r.rank+' this week':'No reps yet'}<small>${r.reps} rep${r.reps===1?'':'s'}</small></button>`:''}</div>`;
  if(focus)out+=`<div class="card focus"><div class="stepno">This week's focus</div><p>${esc(focus)}</p></div>`;
  out+=`<div class="card daily"><div><h3>Daily 5</h3><p class="muted small" style="margin:4px 0 0">5 quick questions from everything we've put in. Every answer is a rep.</p></div><button class="btn primary" data-act="daily">Start</button></div>`;
  out+='<div class="list cats">'+CATS.map(c=>{
    const ready=catSeries(c).length>0,st=catStats(c);
    return ready?`<button class="item cat" data-act="open-cat" data-k="${c.id}"><span><div class="t">${esc(c.title)}</div><div class="s">${esc(c.sub)}</div></span>${ring(st.tot?Math.round(st.got/st.tot*100):0)}<span class="go">›</span></button>`
      :`<div class="item cat off" aria-disabled="true"><span><div class="t">${esc(c.title)}</div><div class="s">${esc(c.sub)}</div></span><span class="pill">Coming soon</span></div>`;
  }).join('')+'</div>';
  return out;
}

/* ---------- category ---------- */
function catView(){
  const c=CATS.find(x=>x.id===ui.nav.cat);
  let out=`<button class="back" data-act="nav-back">‹ Home</button><h2 style="margin-bottom:4px">${esc(c.title)}</h2><p class="muted small" style="margin:0 0 12px">${esc(c.sub)}</p>`;
  if(c.sections){
    return out+'<div class="list cats">'+c.sections.map(s=>{
      const ser=secSeries(s),st=ser.map(seriesStats).reduce((a,x)=>({tot:a.tot+x.tot,got:a.got+x.got}),{tot:0,got:0});
      return ser.length?`<button class="item cat" data-act="open-sec" data-k="${s.id}"><span><div class="t">${esc(s.title)}</div><div class="s">${esc(s.sub)}</div></span>${ring(st.tot?Math.round(st.got/st.tot*100):0)}<span class="go">›</span></button>`
        :`<div class="item cat off" aria-disabled="true"><span><div class="t">${esc(s.title)}</div><div class="s">${esc(s.sub)}</div></span><span class="pill">Coming soon</span></div>`;
    }).join('')+'</div>';
  }
  return out+groupsHtml(c.groups);
}
function secView(){
  const c=CATS.find(x=>x.id===ui.nav.cat),s=c.sections.find(x=>x.id===ui.nav.sec);
  return `<button class="back" data-act="nav-back">‹ ${esc(c.title)}</button><h2 style="margin-bottom:4px">${esc(s.title)}</h2><p class="muted small" style="margin:0 0 12px">${esc(s.sub)}</p>`+
    '<div class="list cats">'+s.groups.map(g=>{
      const st=g.series.map(seriesStats).reduce((a,x)=>({tot:a.tot+x.tot,got:a.got+x.got}),{tot:0,got:0});
      return `<button class="item cat" data-act="open-grp" data-k="${esc(g.id)}"><span><div class="t">${esc(g.title)}</div><div class="s">${esc(g.sub||'')}</div></span>${ring(st.tot?Math.round(st.got/st.tot*100):0)}<span class="go">›</span></button>`;
    }).join('')+'</div>';
}
function grpView(){
  const g=allGroups(CATS.find(x=>x.id===ui.nav.cat)).find(x=>x.id===ui.nav.grp),s=secOf(g.series[0]);
  return `<button class="back" data-act="nav-back">‹ ${esc(s?s.title:'Back')}</button><h2 style="margin-bottom:4px">${esc(g.title)}</h2><p class="muted small" style="margin:0 0 6px">${esc(g.sub||'')}</p>`+groupsHtml([g],true);
}
function groupsHtml(groups,noHead){
  let out='';
  groups.forEach(g=>{
    out+=(noHead?'':`<div class="grp">${esc(g.title)}</div>`)+`<div class="list" style="margin-top:10px">`+g.series.map(s=>{
      const st=seriesStats(s),done=st.tot&&st.got===st.tot;
      return `<button class="item" data-act="open-series" data-k="${esc(s)}"><span style="flex:1;min-width:0"><div class="t">${esc(s)}${done?' <span class="pill good">Mastered</span>':''}</div><div class="s">${esc(SERIES_SUB[s]||'')}</div>
        <div class="bar thin" style="margin-top:8px"><span style="width:${pct(st)}%"></span></div></span><span class="go">›</span></button>`;
    }).join('')+'</div>';
  });
  return out;
}

/* ---------- series ---------- */
function rulesCard(open,list){
  return `<details class="card"${open?' open':''}><summary><h3>Our rules</h3></summary><ol class="rules">${(list||RULES).map(r=>`<li><b>${esc(r[0])}</b> <span class="muted">${esc(r[1])}</span></li>`).join('')}</ol></details>`;
}
function seriesView(){
  const s=ui.nav.series,c=catOf(s),sec=secOf(s),st=seriesStats(s),pl=PLAYS.filter(p=>p.series===s),qs=QUIZ.filter(x=>x.series===s);
  const grp=grpOf(s);
  let out=`<button class="back" data-act="nav-back">‹ ${esc(grp&&grp.id&&grp.series.length>1?grp.title:sec&&!soloSec(sec)?sec.title:c.title)}</button>
    <div class="row spread"><h2>${esc(stitle(s))}</h2>${ring(pct(st))}</div><p class="muted small" style="margin:2px 0 14px">${esc(SERIES_SUB[s]||'')}</p>`;
  if(SERIES_RULES[s])out+=rulesCard(true,SERIES_RULES[s]);
  if(pl.length){
    out+=`<div class="grp">Learn · ${st.seen} of ${pl.length} watched</div><div class="list">`+pl.map(p=>
      `<button class="item" data-act="open-play" data-id="${p.id}"><span class="ck${store.plays[p.id]?' on':''}" aria-label="${store.plays[p.id]?'Watched':'Not watched yet'}">✓</span><span><div class="t">${esc(p.title)}</div><div class="s">${esc(p.sub)}</div></span><span class="go">›</span></button>`).join('')+'</div>';
  }
  if(qs.length){
    out+=`<div class="grp">Quiz · ${st.right} of ${qs.length} right</div>
      <div class="card"><p class="muted small" style="margin:0 0 10px">Read the play and pick what you do, or tap the court where you go. Close counts.</p>
      <div class="bar" style="margin-bottom:14px"><span style="width:${qs.length?st.right/qs.length*100:0}%"></span></div>
      <button class="btn primary block" data-act="series-quiz">Start the quiz (${qs.length})</button></div>`;
  }
  out+=`<p class="muted small" style="text-align:center;margin-top:6px">Draw-it-yourself is coming later.</p>`;
  return out+legend();
}

/* ---------- play ---------- */
function legend(){
  const l=(d,extra)=>`<svg width="34" height="12" viewBox="0 0 34 12"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.8" ${extra||''}/></svg>`;
  return `<div class="legend"><span>${l('M2 6H30','stroke-dasharray="4 3"')}Pass</span><span>${l('M2 6H30')}Cut</span><span>${l('M2 6l3-3 4 6 4-6 4 6 4-6 4 6 3-3h4')}Dribble</span><span>${l('M2 6H28M28 1V11')}Screen</span><span><svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="#ff7a1a"/></svg>Ball</span><span style="color:#b98a00">✕ Defender</span><span><svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="#0b2318" stroke="#ffb3a7" stroke-width="1.5"/></svg>Them (on defense)</span></div>`;
}
function curPlay(){return PLAYS.find(p=>p.id===ui.play);}
function playView(){
  const p=curPlay(),n=p.steps.length,i=ui.step,done=i>=n;
  return `<button class="back" data-act="nav-back">‹ ${esc(stitle(p.series))}</button>
  <div class="row spread" style="margin-bottom:10px"><h2 style="font-size:22px">${esc(p.title)}</h2><span class="pill">${esc(stitle(p.series))}</span></div>
  <div class="court-wrap" id="court"></div>
  <div class="stepno" style="margin-top:12px">${done?'Done':'Step '+(i+1)+' of '+n}</div>
  <div class="dots">${p.steps.map((_,k)=>`<i class="${k<i||done?'on':''}"></i>`).join('')}</div>
  <p class="cap" id="cap">${esc(done?p.end:p.steps[i].cap)}</p>
  <div class="ctl"><button class="btn" data-act="step-back" ${i===0?'disabled':''} aria-label="Previous step">‹ Back</button>
  <button class="btn primary" data-act="step-next">${done?'↺ Replay':i===0?'▶ Run step 1':'▶ Next'}</button>
  <button class="btn" data-act="play-all" aria-label="Play all steps">▶▶ All</button></div>
  ${p.video?`<p class="small" style="margin-top:14px"><a href="${esc(p.video)}" target="_blank" rel="noopener">Watch the video ↗</a> <span class="muted">(needs internet)</span></p>`:''}
  ${legend()}`;
}
function drawPlay(frame){
  const p=curPlay(),i=Math.min(ui.step,p.steps.length),st=stateAt(p,i);
  const f=frame||{pos:st.pos,ball:st.ball,arrows:i<p.steps.length?p.steps[i].a.map(a=>arrowSvg(a,st,applyStep(st,p.steps[i]))):[]};
  $('#court').innerHTML=courtSvg(Object.assign({view:p.view},f));
}
function markViewed(p){if(!store.plays[p.id]){store.plays[p.id]=true;save();logEvent('play',p.id,p.series,null);}}

/* ---------- quiz (reads + where mixed) ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(ids,label,back){
  ui.q={items:ids,label,back,i:0,right:0,missed:[],answered:false,choice:null,guess:null,done:false};
  go({view:'quiz',back});
}
function dailyIds(){
  const avail=QUIZ.filter(x=>catOf(x.series));
  const fresh=shuffle(avail.filter(x=>!(store[x.kind][x.id]&&store[x.kind][x.id].last)));
  const known=shuffle(avail.filter(x=>store[x.kind][x.id]&&store[x.kind][x.id].last));
  return fresh.concat(known).slice(0,5).map(x=>x.id);
}
function curItem(){return qById(ui.q.items[ui.q.i]);}
function quizView(){
  const q=ui.q;
  if(q.done){
    const n=q.items.length;
    return `<div class="card" style="text-align:center"><div class="stepno">${esc(q.label)}</div><div class="big" style="margin:10px 0 4px">${q.right}/${n}</div>
      <p class="muted">${q.right===n?'Perfect. That\'s how you know it.':q.right>=n*.7?'Nice work. Clean up the misses.':'Keep at it. Walk through the plays in Learn, then try again.'}</p>
      <div class="list" style="margin-top:14px">${q.missed.length?`<button class="btn primary block" data-act="retry-missed">Try the ${q.missed.length} I missed</button>`:''}
      <button class="btn block${q.missed.length?'':' primary'}" data-act="quiz-again">${q.label==='Daily 5'?'Another 5':'Start over'}</button>
      <button class="btn block" data-act="quit">Done</button></div></div>`;
  }
  const it=curItem();
  let body='';
  if(it.kind==='reads'){
    if(!q.order)q.order=shuffle(it.choices.map((_,k)=>k));
    body=`<p class="sit">${esc(it.sit)}</p><p class="prompt">${esc(it.q)}</p><div class="choices" id="choices">`+
      q.order.map(k=>{const c=it.choices[k];let cls='';if(q.answered){if(c.ok)cls='right';else if(q.choice===k)cls='wrong';}
        return `<button class="choice ${cls}" data-act="choose" data-k="${k}" ${q.answered?'disabled':''}>${esc(c.t)}</button>`;}).join('')+'</div>';
    if(q.answered){const c=it.choices[q.choice],ok=!!c.ok,right=it.choices.find(x=>x.ok);
      body+=`<div class="fb ${ok?'good':'bad'}"><b>${ok?'Right!':'Not quite'}</b>${esc(c.why)}${ok?'':'<br><span class="muted">Right answer: '+esc(right.t)+'.</span>'}</div>`;}
  }else{
    body=`<p class="prompt">${esc(it.q)}</p>`;
    if(q.answered){const ok=q.ok;body+=`<div class="fb ${ok?'good':'bad'}"><b>${ok?'Right spot!':'Not quite'}</b>${esc(it.why)}${ok?'':'<br><span class="muted">The gold circle is the right spot.</span>'}</div>`;}
    else body+=`<p class="muted small" style="margin:-4px 0 10px">Tap the court, or drag your player.</p><button class="btn primary block" data-act="check" ${q.guess?'':'disabled'}>Check my spot</button>`;
  }
  return `<div class="qhead"><span class="stepno">${esc(q.label)} · ${q.i+1} of ${q.items.length} · ${it.kind==='reads'?'Read it':'Where do you go?'}</span><button class="back" style="margin:0" data-act="quit">Quit</button></div>
    <div class="court-wrap" id="court"></div>${body}
    ${q.answered?`<div class="row" style="margin-top:12px"><button class="btn" data-act="replay-show">↺ Show me</button><button class="btn primary" style="flex:1" data-act="next-q">${q.i+1<q.items.length?'Next ›':'See score'}</button></div>`:''}`;
}
function qFrame(it,extra){
  const st={pos:it.pos,ball:it.ball};
  return Object.assign({view:it.view,pos:it.pos,ball:it.ball,you:it.you,arrows:(it.ctx||[]).map(a=>arrowSvg(a,st,st,{dim:false}))},extra||{});
}
function drawQ(frame){
  const it=curItem(),q=ui.q,el=$('#court');if(!el)return;
  if(frame){el.innerHTML=courtSvg(Object.assign({view:it.view,you:it.you},frame));return;}
  if(it.kind==='where'){
    const pos=copyPos(it.pos);let marks='',under='';
    if(q.guess){
      pos[it.you]=q.guess;
      under=`<circle cx="${it.pos[it.you][0]}" cy="${it.pos[it.you][1]}" r="1.75" fill="none" stroke="rgba(255,255,255,.5)" stroke-width=".2" stroke-dasharray=".5 .4"/>`;
    }
    if(q.answered){
      marks=`<circle cx="${it.ans[0]}" cy="${it.ans[1]}" r="${it.tol}" fill="rgba(255,210,90,.18)" stroke="#ffd25a" stroke-width=".3" stroke-dasharray="1 .6"/>`;
      if(!q.ok)marks+=`<path d="M${f2(q.guess[0])} ${f2(q.guess[1])}L${it.ans[0]} ${it.ans[1]}" stroke="#ffd25a" stroke-width=".25" stroke-dasharray=".6 .5"/>`;
    }
    el.innerHTML=courtSvg(qFrame(it,{pos,under,marks}));
    if(!q.answered)bindTap(el,it);
  }else el.innerHTML=courtSvg(qFrame(it));
}
function bindTap(el,it){
  const svg=el.querySelector('svg');let down=false;
  const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const r=p.matrixTransform(svg.getScreenCTM().inverse());return [f2(clamp(r.x,-24,24)),f2(clamp(r.y,.5,it.view==='full94'?93.5:46.5))];};
  svg.addEventListener('pointerdown',e=>{down=true;svg.setPointerCapture(e.pointerId);ui.q.guess=pt(e);redrawGuess(it);});
  svg.addEventListener('pointermove',e=>{if(!down)return;e.preventDefault();ui.q.guess=pt(e);redrawGuess(it);});
  svg.addEventListener('pointerup',()=>{down=false;});
  svg.addEventListener('pointercancel',()=>{down=false;});
}
function redrawGuess(it){
  const svg=$('#court svg'),q=ui.q;
  const pos=copyPos(it.pos);pos[it.you]=q.guess;
  const tmp=document.createElement('div');
  tmp.innerHTML=courtSvg(qFrame(it,{pos,under:`<circle cx="${it.pos[it.you][0]}" cy="${it.pos[it.you][1]}" r="1.75" fill="none" stroke="rgba(255,255,255,.5)" stroke-width=".2" stroke-dasharray=".5 .4"/>`}));
  svg.innerHTML=tmp.firstChild.innerHTML;
  const b=document.querySelector('[data-act="check"]');if(b)b.disabled=false;
}
function showAnswer(){
  const it=curItem();if(!it.show)return;
  const st={pos:copyPos(it.pos),ball:it.ball};
  const marks=it.kind==='where'?`<circle cx="${it.ans[0]}" cy="${it.ans[1]}" r="${it.tol}" fill="rgba(255,210,90,.18)" stroke="#ffd25a" stroke-width=".3" stroke-dasharray="1 .6"/>`:'';
  animateSeq(st,it.show,f=>drawQ(Object.assign({marks},f)),en=>{
    drawQ({pos:en.pos,ball:en.ball,marks,arrows:[]});
  },350);
}
function record(kind,id,ok){
  const r=store[kind][id]||{tries:0,right:0};r.tries++;if(ok)r.right++;r.last=ok;store[kind][id]=r;save();
  const it=qById(id);
  logEvent(kind,id,it?it.series:'',ok);
}

/* ---------- Tracker: sign-in, offline outbox, team board ---------- */
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const SERIES4=['Transition','Rules','Low','Point','5 Out','Man Rules'];
const BADGE_SHORT={'5 Out':'5 OUT','Man Rules':'MAN D','Transition':'TRANS'};
function logEvent(kind,item,series,ok){
  if(!API_URL||!store.player)return;
  store.outbox.push({who:store.player.login,id:newId(),t:Date.now(),kind,item,series,ok});
  if(store.outbox.length>3000)store.outbox=store.outbox.slice(-3000);
  save();flush();
}
let flushing=false;
async function flush(){
  if(!API_URL||flushing||!store.outbox.length||navigator.onLine===false)return;
  flushing=true;
  try{
    const who=store.outbox[0].who,batch=store.outbox.filter(e=>e.who===who).slice(0,200);
    const res=await fetch(API_URL,{method:'POST',body:JSON.stringify({action:'log',who,events:batch.map(e=>({id:e.id,t:e.t,kind:e.kind,item:e.item,series:e.series,ok:e.ok}))})}).then(r=>r.json());
    if(res.ok||res.error==='unknown player'){
      const ids=new Set(batch.map(e=>e.id));store.outbox=store.outbox.filter(e=>!ids.has(e.id));save();
      flushing=false;if(store.outbox.length)flush();return;
    }
  }catch(e){}
  flushing=false;
}
async function apiGet(params){const r=await fetch(API_URL+'?'+new URLSearchParams(params).toString());return r.json();}

function initials(p){const w=String(p.wnba||p.login||p.name||'?').trim().split(/\s+/);return ((w[0]||'')[0]||'')+(w.length>1?(w[w.length-1][0]||''):'');}
function avatar(p,size){
  const s=size||40,ini=`<span class="av ini" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.38)}px${p.photo?';display:none':''}">${esc(initials(p).toUpperCase())}</span>`;
  if(!p.photo)return ini;
  return `<img class="av" src="${esc(p.photo)}" alt="" width="${s}" height="${s}" style="width:${s}px;height:${s}px" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`+ini;
}

const signin={msg:'',found:null,busy:false};
function signInView(){
  if(signin.found){const f=signin.found;
    return `<div class="card signin">${avatar({wnba:f.login,photo:f.photo},76)}<h2>Welcome, ${esc(f.name)}!</h2>
      <p class="muted">You're playing as <b>${esc(f.login)}</b>.</p>
      <button class="btn primary block" data-act="si-yes">Yes, that's me</button>
      <button class="btn block" data-act="si-no" style="margin-top:8px">No, that's not me</button></div>`;}
  return `<div class="card signin"><img src="logo-mark.png" alt="" width="84" height="84" onerror="this.remove()">
    <h2>Sign in</h2><p class="muted">Type the name of the WNBA player Coach gave you.</p>
    <form data-form="signin"><label class="sr" for="si-who">Your WNBA player</label>
      <input id="si-who" name="who" class="inp" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="e.g. Angel Reese" required>
      <button class="btn primary block" type="submit" ${signin.busy?'disabled':''}>${signin.busy?'Checking…':'Sign in'}</button></form>
    ${signin.msg?`<p class="err" role="alert">${esc(signin.msg)}</p>`:''}
    <p class="muted small" style="margin:14px 0 0">Don't know your player? Ask Coach.</p></div>`;
}

function mastered(series,plays,last){
  const pl=PLAYS.filter(p=>p.series===series),qs=READS.concat(WHERE).filter(x=>x.series===series);
  return pl.every(p=>plays.indexOf(p.id)>=0)&&qs.every(x=>last[x.id]===1);
}
function myBadge(series){
  const plays=Object.keys(store.plays).filter(k=>store.plays[k]),last={};
  ['reads','where'].forEach(k=>{for(const id in store[k])last[id]=store[k][id].last?1:0;});
  return mastered(series,plays,last);
}
function badgesHtml(has){return `<span class="bdgs">${SERIES4.map(s=>`<span class="bdg${has(s)?' on':''}" title="${esc(s)}${has(s)?' mastered':''}">${esc(BADGE_SHORT[s]||s.toUpperCase())}</span>`).join('')}</span>`;}
function isMe(p){return !!store.player&&String(p.wnba||'').toLowerCase()===String(store.player.login).toLowerCase();}
function nameOf(p){return esc(p.name)+(p.number?` <span class="muted">#${esc(p.number)}</span>`:'');}
function parseLocalDate(s){const p=String(s||'').split('-').map(Number);if(p.length<3)return '';return new Date(p[0],p[1]-1,p[2]).toLocaleDateString([],{month:'short',day:'numeric'});}

let boardBusy=false;
async function loadBoard(force){
  if(!API_URL||!store.player||boardBusy||navigator.onLine===false)return;
  if(!force&&store.board&&Date.now()-store.board.at<60000)return;
  boardBusy=true;
  try{const r=await apiGet({action:'board',who:store.player.login});
    if(r.ok){store.board={at:Date.now(),week:r.week,players:r.players,focus:r.focus||''};save();boardBusy=false;if(!ui.coach&&(store.tab==='team'||(store.tab==='home'&&ui.nav.view==='home')))render(true);return;}
  }catch(e){}
  boardBusy=false;
}
function boardHtml(){
  const b=store.board;
  if(!b)return `<div class="card"><h3>This week's reps</h3><p class="muted" style="margin:6px 0 0">${navigator.onLine===false?'Connect to see the team board.':'Loading the team board…'}</p></div>`;
  const ps=b.players.slice(),active=ps.filter(p=>p.reps>0).sort((a,c)=>c.reps-a.reps||a.name.localeCompare(c.name)),max=active.length?active[0].reps:1;
  const idle=ps.length-active.length;
  let out=`<div class="card"><div class="row spread"><h3>This week's reps</h3><span class="muted small">since Mon ${parseLocalDate(b.week)}</span></div>
    <p class="muted small" style="margin:4px 0 10px">Every quiz answer is a rep. Resets every Monday.</p>`;
  out+=active.length?`<ol class="lb">${active.map((p,i)=>`<li class="${isMe(p)?'me':''}"><span class="rk">${i+1}</span>${avatar(p,38)}<span class="nm"><b>${nameOf(p)}</b><span class="muted small">${esc(p.wnba)}</span><span class="bar thin"><span style="width:${Math.max(4,p.reps/max*100)}%"></span></span></span><span class="rp">${p.reps}</span></li>`).join('')}</ol>`
    :'<p class="muted">No reps yet this week. Be the first.</p>';
  if(idle&&active.length)out+=`<p class="muted small" style="margin:10px 0 0">${idle} teammate${idle>1?'s haven\'t':' hasn\'t'} started this week.</p>`;
  out+='</div>';
  const withB=ps.map(p=>{const has=s=>mastered(s,p.plays||[],p.last||{});return {p,has,n:SERIES4.filter(has).length};})
    .sort((a,c)=>c.n-a.n||a.p.name.localeCompare(c.p.name));
  out+=`<div class="card"><h3>Badges</h3><p class="muted small" style="margin:4px 0 10px">Earn a badge by watching every play in a series and getting every question in it right.</p>
    <ul class="lb bd">${withB.map(x=>`<li class="${isMe(x.p)?'me':''}">${avatar(x.p,34)}<span class="nm"><b>${nameOf(x.p)}</b></span>${badgesHtml(x.has)}</li>`).join('')}</ul>
    <p class="muted small" style="margin:10px 0 0">Updated ${new Date(b.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}. <button class="link" data-act="board-refresh">Refresh</button></p></div>`;
  return out;
}

function teamView(){
  if(ui.coach)return coachView();
  let out='';
  if(API_URL){
    if(store.player){
      const pend=store.outbox.length;
      out+=`<div class="card row" style="gap:12px">${avatar({wnba:store.player.login,photo:store.player.photo},52)}<div style="flex:1;min-width:0"><div class="t">${esc(store.player.name)}</div><div class="muted small">Playing as ${esc(store.player.login)}</div>${pend?`<div class="small" style="color:var(--warn)">${pend} answer${pend>1?'s':''} will send when you have signal</div>`:''}</div><button class="link" data-act="switch">Switch</button></div>`;
      out+=boardHtml();
    }else out+=`<div class="card"><h3>Join the team board</h3><p class="muted" style="margin:6px 0 12px">Sign in with your WNBA player to show up on the reps board and earn badges.</p><button class="btn primary" data-act="si-start">Sign in</button></div>`;
  }
  out+=`<div class="card"><h3>My badges</h3><div style="margin-top:10px">${badgesHtml(myBadge)}</div></div>`;
  out+=myProgressHtml();
  out+=`<details class="card"><summary><h3>Put it on your home screen</h3></summary>
   <p style="margin:0 0 8px"><b>iPhone (Safari):</b> tap the Share button, then <b>Add to Home Screen</b>.</p>
   <p style="margin:0"><b>Android (Chrome):</b> tap ⋮, then <b>Add to Home screen</b> or <b>Install app</b>.</p>
   <p class="muted small" style="margin:8px 0 0">Open it once with internet, and after that it works with no signal.</p></details>
  <button class="btn block" data-act="reset" style="margin-top:4px">Reset my progress on this phone</button>
  ${API_URL?'<p style="text-align:center;margin:18px 0 0"><button class="link small" data-act="coach-open">Coach view</button></p>':''}`;
  return out;
}
function myProgressHtml(){
  return `<h3 style="margin:18px 0 8px">My progress</h3>`+SERIES4.map(s=>{
    const pl=PLAYS.filter(p=>p.series===s),rd=READS.filter(x=>x.series===s),wh=WHERE.filter(x=>x.series===s);
    const seen=pl.filter(p=>store.plays[p.id]).length,r=rd.filter(x=>store.reads[x.id]&&store.reads[x.id].last).length,w=wh.filter(x=>store.where[x.id]&&store.where[x.id].last).length;
    const tot=pl.length+rd.length+wh.length,got=seen+r+w;
    return `<div class="card"><div class="row spread"><h3>${esc(s)}</h3><span class="pill${got===tot&&tot?' good':''}">${got===tot&&tot?'Mastered':Math.round(tot?got/tot*100:0)+'%'}</span></div>
      <div class="bar" style="margin-top:10px"><span style="width:${tot?got/tot*100:0}%"></span></div>
      <div class="stat small muted">${pl.length?`<div class="row spread"><span>Plays watched</span><span>${seen} / ${pl.length}</span></div>`:''}
      ${rd.length?`<div class="row spread"><span>Reads right</span><span>${r} / ${rd.length}</span></div>`:''}
      ${wh.length?`<div class="row spread"><span>Spots right</span><span>${w} / ${wh.length}</span></div>`:''}</div></div>`;
  }).join('');
}

/* ---------- Coach view ---------- */
async function loadCoach(){
  ui.coachBusy=true;ui.coachErr='';render(true);
  try{const r=await apiGet({action:'coach',key:store.coachKey});
    if(r.ok){ui.coachData=r;}else{ui.coachErr='That coach key didn\'t work.';store.coachKey='';save();}
  }catch(e){ui.coachErr='Couldn\'t reach the sheet. Check your signal.';}
  ui.coachBusy=false;render(true);
}
function coachView(){
  let out=`<button class="back" data-act="coach-close">‹ Team</button><h2 style="margin-bottom:10px">Coach view</h2>`;
  if(!store.coachKey)return out+`<div class="card"><p class="muted" style="margin:0 0 10px">Enter the coach key from the Settings tab of your tracker sheet.</p>
    <form data-form="coachkey"><input class="inp" name="key" inputmode="numeric" autocomplete="off" placeholder="Coach key" required><button class="btn primary block" type="submit" style="margin-top:10px">Open</button></form>
    ${ui.coachErr?`<p class="err">${esc(ui.coachErr)}</p>`:''}</div>`;
  const d=ui.coachData;
  if(!d)return out+`<p class="muted">${ui.coachBusy?'Loading…':esc(ui.coachErr||'')}</p>`;
  const ps=d.players.slice().sort((a,c)=>c.reps-a.reps||c.total-a.total||a.name.localeCompare(c.name));
  const on=ps.filter(p=>p.reps>0).length;
  out+=`<div class="card"><div class="row spread"><h3>This week</h3><span class="muted small">since Mon ${parseLocalDate(d.week)}</span></div>
    <p style="margin:6px 0 10px"><b>${on} of ${ps.length}</b> players have practiced this week.</p>
    <div class="tbl"><table><thead><tr><th>Player</th><th>Week</th><th>All</th><th>Last on</th><th>Badges</th></tr></thead><tbody>
    ${ps.map(p=>{const n=SERIES4.filter(s=>mastered(s,p.plays||[],p.last||{})).length;
      return `<tr><td><b>${esc(p.name)}</b><br><span class="muted small">${esc(p.wnba)}</span></td><td>${p.reps}</td><td>${p.total}</td><td class="small">${p.lastActive?parseLocalDate(p.lastActive):'<span class="muted">never</span>'}</td><td>${n}/${SERIES4.length}</td></tr>`;}).join('')}
    </tbody></table></div></div>`;
  const all=READS.concat(WHERE),miss=Object.keys(d.items).map(id=>({id,it:d.items[id],q:all.find(x=>x.id===id)})).filter(x=>x.q&&x.it.tries>=3)
    .sort((a,c)=>c.it.wrong/c.it.tries-a.it.wrong/a.it.tries).slice(0,8);
  out+=`<div class="card"><h3>Most-missed questions</h3><p class="muted small" style="margin:4px 0 10px">Every try counts; shows questions with 3+ tries. Re-teach these at practice.</p>
    ${miss.length?`<ol class="rules">${miss.map(x=>`<li><b>${Math.round(x.it.wrong/x.it.tries*100)}% missed</b> <span class="muted small">(${x.it.tries} tries · ${esc(stitle(x.q.series))})</span><br>${esc(x.q.sit?x.q.sit+' ':'')}${esc(x.q.q)}</li>`).join('')}</ol>`:'<p class="muted">Not enough answers yet.</p>'}</div>
  <div class="row"><button class="btn" data-act="coach-refresh">↻ Refresh</button><button class="link" data-act="coach-forget" style="margin-left:auto">Forget coach key</button></div>`;
  return out;
}

/* ---------- forms ---------- */
document.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  if(f.dataset.form==='signin'){
    const who=f.who.value.trim();if(!who)return;
    if(navigator.onLine===false){signin.msg='You need signal the first time you sign in.';render();return;}
    signin.busy=true;signin.msg='';render();
    try{const r=await apiGet({action:'login',who});
      if(r.ok)signin.found={login:r.login,name:r.name,number:r.number,photo:r.photo};else signin.msg=r.error||'That name didn\'t match.';
    }catch(err){signin.msg='Couldn\'t reach the team list. Check your signal and try again.';}
    signin.busy=false;render();
    if(!signin.found){const i=$('#si-who');if(i){i.value=who;i.focus();}}
  }else if(f.dataset.form==='coachkey'){
    store.coachKey=f.key.value.trim();save();loadCoach();
  }
});
window.addEventListener('online',()=>{flush();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')flush();});

/* ---------- events ---------- */
function navBack(){
  const n=ui.nav;
  if(n.view==='play'){const p=curPlay();ui.play=null;go({view:'series',series:p.series});}
  else if(n.view==='quiz'){ui.q=null;go(n.back||{view:'home'});}
  else if(n.view==='series'){const c=catOf(n.series),s=secOf(n.series),g=grpOf(n.series);
    go(g&&g.id&&s&&g.series.length>1?{view:'grp',cat:c.id,sec:s.id,grp:g.id}:s&&!soloSec(s)?{view:'sec',cat:c.id,sec:s.id}:{view:'cat',cat:c.id});}
  else if(n.view==='grp'){go({view:'sec',cat:n.cat,sec:n.sec});}
  else if(n.view==='sec'){go({view:'cat',cat:n.cat});}
  else go({view:'home'});
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,k=b.dataset.k;
  if(act==='tab'){
    if(store.tab===k&&k==='home'){ui.play=null;ui.q=null;ui.nav={view:'home'};}
    store.tab=k;ui.coach=false;save();render();
  }
  else if(act==='nav-back'){navBack();}
  else if(act==='open-cat'){go({view:'cat',cat:k});}
  else if(act==='open-sec'){const sc=(CATS.find(c=>c.id===ui.nav.cat).sections||[]).find(x=>x.id===k);if(soloSec(sc))go({view:'series',series:sc.groups[0].series[0]});else go({view:'sec',cat:ui.nav.cat,sec:k});}
  else if(act==='open-grp'){const g=allGroups(CATS.find(c=>c.id===ui.nav.cat)).find(x=>x.id===k);
    if(g&&g.series.length===1)go({view:'series',series:g.series[0]});else go({view:'grp',cat:ui.nav.cat,sec:ui.nav.sec,grp:k});}
  else if(act==='open-series'){go({view:'series',series:k});}
  else if(act==='open-play'){ui.play=b.dataset.id;ui.step=0;go({view:'play'});}
  else if(act==='step-back'){stopAnim();ui.step=Math.max(0,ui.step-1);render();}
  else if(act==='step-next'||act==='play-all'){
    const p=curPlay();stopAnim();
    if(ui.step>=p.steps.length){ui.step=0;}
    const runOne=()=>{
      const st=stateAt(p,ui.step);
      animateStep(st,p.steps[ui.step],f=>drawPlay(f),()=>{
        ui.step++;
        if(ui.step>=p.steps.length)markViewed(p);
        const keep=ui.play;render(true);
        if(act==='play-all'&&keep===ui.play&&ui.step<p.steps.length)setTimeout(()=>{if(ui.play===keep&&ui.nav.view==='play')runOne();},500);
      });
    };
    if(act==='step-next'&&b.textContent.indexOf('Replay')>=0){render(true);return;}
    runOne();
  }
  else if(act==='daily'){const ids=dailyIds();if(ids.length)startQuiz(ids,'Daily 5',{view:'home'});}
  else if(act==='series-quiz'){const s=ui.nav.series;startQuiz(shuffle(QUIZ.filter(x=>x.series===s).map(x=>x.id)),stitle(s)+' quiz',{view:'series',series:s});}
  else if(act==='quiz-again'){const q=ui.q;
    if(q.label==='Daily 5')startQuiz(dailyIds(),'Daily 5',q.back);else startQuiz(shuffle(q.items),q.label,q.back);}
  else if(act==='retry-missed'){const q=ui.q;startQuiz(q.missed.slice(),q.label,q.back);}
  else if(act==='quit'){navBack();}
  else if(act==='choose'){
    const q=ui.q,it=curItem();if(q.answered)return;
    q.answered=true;q.choice=Number(k);const ok=!!it.choices[q.choice].ok;
    if(ok)q.right++;else q.missed.push(it.id);record('reads',it.id,ok);
    render(true);showAnswer();
  }
  else if(act==='check'){
    const q=ui.q,it=curItem();if(!q.guess||q.answered)return;
    const d=Math.hypot(q.guess[0]-it.ans[0],q.guess[1]-it.ans[1]);
    q.answered=true;q.ok=d<=it.tol&&(!it.out3||Math.hypot(q.guess[0]-RIM[0],q.guess[1]-RIM[1])>ARC);if(q.ok)q.right++;else q.missed.push(it.id);record('where',it.id,q.ok);
    render(true);setTimeout(showAnswer,700);
  }
  else if(act==='replay-show'){stopAnim();drawQ();setTimeout(showAnswer,300);}
  else if(act==='next-q'){
    const q=ui.q;q.i++;q.answered=false;q.choice=null;q.guess=null;q.order=null;q.ok=null;
    if(q.i>=q.items.length)q.done=true;render();
  }
  else if(act==='si-yes'){store.player=signin.found;signin.found=null;signin.msg='';store.board=null;store.tab='home';ui.nav={view:'home'};save();render();}
  else if(act==='si-no'){signin.found=null;signin.msg='';render();}
  else if(act==='switch'){
    if(confirm("Switch player? This phone's progress will be cleared. Your answers are already saved to the team board.")){
      flush();store.player=null;store.plays={};store.reads={};store.where={};store.board=null;ui.nav={view:'home'};save();render();}
  }
  else if(act==='board-refresh'){loadBoard(true);}
  else if(act==='coach-open'){ui.coach=true;render();if(store.coachKey)loadCoach();}
  else if(act==='coach-close'){ui.coach=false;render();}
  else if(act==='coach-refresh'){loadCoach();}
  else if(act==='coach-forget'){store.coachKey='';ui.coachData=null;save();render();}
  else if(act==='reset'){
    if(confirm('Reset your progress on this phone?')){store.plays={};store.reads={};store.where={};save();render();}
  }
});

render();
flush();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
</script>
</body>
</html>
