<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Eagles Playbook</title>
<meta name="description" content="Stratton Girls Basketball playbook trainer: learn the Princeton motion and quiz your reads.">
<meta name="theme-color" content="#0f3d28">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eagles Playbook">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon-64.png" type="image/png">
<style>
:root{
  --bg:#eef4f0;--surface:#fff;--surface-2:#f3f8f5;--line:#d5e3db;--ink:#122019;--muted:#586b60;
  --band:#0f3d28;--band-ink:#f2f8f4;--band-muted:#9fc3ae;
  --brand:#1b6b43;--on-brand:#fff;--chip:#e2efe8;--chip-ink:#155636;
  --good:#1f8a51;--good-soft:#dcefe3;--warn:#a8670f;--bad:#c23b2b;--bad-soft:#fbe7e3;--ball:#ff7a1a;--you:#ff9a3c;--gold:#ffd25a;
  --floor:#1f5d3e;--paint:#194f34;--court-line:rgba(255,255,255,.85);--def:#ffe08a;
  --font-display:"Oswald","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:14px;--shadow:0 1px 2px rgba(15,61,40,.06),0 4px 14px rgba(15,61,40,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1712;--surface:#13201a;--surface-2:#1a2b22;--line:#284037;--ink:#e7f1ea;--muted:#9cb0a5;
  --band:#08130d;--band-ink:#eef6f1;--band-muted:#86a896;--brand:#3fae6c;--on-brand:#06120b;--chip:#1e332a;--chip-ink:#8fdcae;
  --good:#4cc27f;--good-soft:#173323;--bad:#e2685a;--bad-soft:#3a201c;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1712;--surface:#13201a;--surface-2:#1a2b22;--line:#284037;--ink:#e7f1ea;--muted:#9cb0a5;
  --band:#08130d;--band-ink:#eef6f1;--band-muted:#86a896;--brand:#3fae6c;--on-brand:#06120b;--chip:#1e332a;--chip-ink:#8fdcae;
  --good:#4cc27f;--good-soft:#173323;--bad:#e2685a;--bad-soft:#3a201c;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.wrap{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--band);color:var(--band-ink);padding-top:env(safe-area-inset-top,0px)}
header .wrap{padding-top:14px;padding-bottom:12px}
.eyebrow{font:500 12px/1 var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--band-muted)}
header h1{font-size:26px;line-height:1.05;margin-top:6px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:56px;height:56px;flex:none}
header h1 span{color:var(--band-muted);font-weight:500}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:12px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--band-ink);border-radius:999px;padding:7px 14px;font:500 14px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--band-ink);color:var(--band);border-color:var(--band-ink)}
main .wrap{padding-top:16px;padding-bottom:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.muted{color:var(--muted)}.small{font-size:14px}
.pill{display:inline-block;font:500 11px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--chip);color:var(--chip-ink);vertical-align:middle}
.pill.good{background:var(--good-soft);color:var(--good)}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 18px;font-weight:600;font-size:16px;cursor:pointer;line-height:1.1;text-decoration:none;color:var(--ink);min-height:44px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.block{width:100%}
.row{display:flex;gap:8px;align-items:center}
.row.spread{justify-content:space-between}
.list{display:grid;gap:8px}
.item{appearance:none;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
.item .t{font:600 17px/1.2 var(--font-display);text-transform:uppercase;letter-spacing:.02em}
.item .s{font-size:14px;color:var(--muted);margin-top:2px}
.item .go{margin-left:auto;color:var(--muted);font-size:20px}
.item .ck{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;border:2px solid var(--line);color:transparent}
.item .ck.on{background:var(--good);border-color:var(--good);color:#fff}
.grp{font:500 13px/1 var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin:18px 0 8px}
.court-wrap{background:var(--floor);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);touch-action:none;user-select:none;-webkit-user-select:none}
svg.court{display:block;width:100%;height:auto}
.cap{font-size:17px;margin:12px 0 4px;min-height:3em}
.stepno{font:500 12px/1 var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dots{display:flex;gap:6px;margin:8px 0 12px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brand)}
.ctl{display:grid;grid-template-columns:auto 1fr auto;gap:8px}
.back{appearance:none;border:0;background:none;color:var(--brand);font-weight:600;padding:6px 0;margin-bottom:8px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:10px}
.legend svg{vertical-align:middle;margin-right:4px}
.prompt{font:600 19px/1.25 var(--font-body);margin:12px 0 10px}
.sit{font-size:15px;color:var(--muted);margin-top:12px}
.choices{display:grid;gap:8px}
.choice{appearance:none;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:600;cursor:pointer;color:var(--ink);min-height:48px}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice[disabled]{cursor:default}
.fb{border-radius:12px;padding:12px 14px;margin-top:12px;font-size:16px}
.fb b{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.06em;font-size:18px;display:block;margin-bottom:2px}
.fb.good{background:var(--good-soft)}.fb.good b{color:var(--good)}
.fb.bad{background:var(--bad-soft)}.fb.bad b{color:var(--bad)}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.bar{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--brand)}
.big{font:700 54px/1 var(--font-display);color:var(--brand)}
.rules{margin:0;padding-left:1.3em;display:grid;gap:6px}
.rules b{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
details.card summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font-size:22px;color:var(--muted)}
details.card[open] summary::after{content:"–"}
details.card[open] summary{margin-bottom:10px}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabbar .wrap{display:grid;grid-template-columns:repeat(2,1fr);max-width:420px}
.tb{appearance:none;border:0;background:none;padding:8px 0 10px;display:grid;justify-items:center;gap:3px;font:500 12px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;min-height:56px}
.tb svg{width:24px;height:24px}
.tb[aria-selected="true"]{color:var(--brand)}
.stat{display:grid;gap:6px;margin-top:12px}
.stat .row{font-size:15px}
a{color:var(--brand)}
.av{border-radius:50%;object-fit:cover;flex:none;background:var(--chip);display:block}
.av.ini{display:grid;place-items:center;background:var(--brand);color:var(--on-brand);font-family:var(--font-display);font-weight:600;letter-spacing:.04em}
.signin{text-align:center;margin-top:12px;display:grid;justify-items:center;gap:8px}
.signin form{display:grid;gap:10px;width:100%;margin-top:6px}
.inp{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:12px 14px;font-size:18px;text-align:center}
.err{color:var(--bad);font-weight:600;margin:10px 0 0}
.link{appearance:none;border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:6px 0;font-size:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.t{font:600 18px/1.2 var(--font-display);text-transform:uppercase;letter-spacing:.02em}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.lb li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px}
.lb li.me{background:var(--chip)}
.lb .rk{font:600 18px/1 var(--font-display);width:22px;text-align:center;color:var(--muted)}
.lb .nm{flex:1;min-width:0;display:grid;gap:2px}
.lb .nm .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .rp{font:700 22px/1 var(--font-display);color:var(--brand);min-width:32px;text-align:right}
.bar.thin{height:6px}
.bdgs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.bdg{font:500 10px/1 var(--font-display);letter-spacing:.08em;padding:5px 6px;border-radius:999px;border:1px dashed var(--line);color:var(--muted);white-space:nowrap}
.bdg.on{background:var(--brand);border:1px solid var(--brand);color:var(--on-brand)}
.lb.bd li{flex-wrap:wrap}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font:500 11px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
[hidden]{display:none!important}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 0 14px}
.hello h2{font-size:28px;margin-top:6px}
.rankchip{appearance:none;border:0;background:var(--brand);color:var(--on-brand);border-radius:14px;padding:8px 12px;font:600 17px/1.1 var(--font-display);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;display:grid;text-align:right}
.rankchip small{font:500 12px/1.3 var(--font-body);text-transform:none;letter-spacing:0;opacity:.85}
.focus{border-left:5px solid var(--ball)}
.focus p{margin:6px 0 0;font-size:17px;font-weight:600}
.daily{display:flex;align-items:center;gap:14px;background:var(--band);color:var(--band-ink);border-color:var(--band)}
.daily .muted{color:var(--band-muted)}
.daily>div{flex:1}
.daily .btn.primary{background:var(--ball);border-color:var(--ball);color:#1b0d03}
.cats{margin-top:4px}
.item.cat{padding:16px}
.item.cat .t{font-size:22px}
.item.cat.off{opacity:.55;cursor:default;box-shadow:none}
.item.cat.off .pill{margin-left:auto}
.ring{--p:0;width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--surface-2) 0);margin-left:auto}
.ring span{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:600 12px/1 var(--font-display)}
.pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>
<body>
<header class="band"><div class="wrap">
  <div class="brand"><img src="logo-mark.png" alt="" width="56" height="56" onerror="this.remove()"><div>
  <div class="eyebrow">Stratton Eagles · Girls Basketball</div>
  <h1>Playbook <span>Trainer</span></h1></div></div>
  <div class="chips" id="chips" role="group" aria-label="Series"></div>
</div></header>
<main><div class="wrap" id="view"></div></main>
<nav class="tabbar" aria-label="Sections"><div class="wrap" role="tablist" id="tabs"></div></nav>

<script>
'use strict';
/* =====================================================================
   CONTENT (plain data). Add plays and quiz questions here.
   Court is in FEET: x = -25 (left sideline) .. 25 (right sideline),
   y = 0 at the baseline up to 47 at half court. The rim is at [0, 5.25].
   Offense players are "1".."5"; defenders are "x1".."x5".
   Actions in a step:
     P(from, to)        pass                (dashed arrow)
     H(from, to)        dribble handoff
     C(p, [x,y], via)   cut                 (solid arrow; optional curve point)
     D(p, [x,y])        dribble             (zig-zag arrow)
     S(p, [x,y])        screen              (T-line)
   ===================================================================== */
const P=(f,to)=>({t:'pass',f:String(f),to:String(to)});
const H=(f,to)=>({t:'hand',f:String(f),to:String(to)});
const C=(p,to,via)=>({t:'cut',p:String(p),to,via});
const D=(p,to)=>({t:'drib',p:String(p),to});
const S=(p,to)=>({t:'screen',p:String(p),to});

const SP={lb:[-7.5,8],rb:[7.5,8],hp:[0,18],ls:[-8,26],rs:[8,26],lw:[-20,18],rw:[20,18],lc:[-21.5,3],rc:[21.5,3],top:[0,28]};
const LOW  ={1:SP.ls,2:SP.rs,3:SP.lw,4:SP.rw,5:SP.lb};
const POINT={1:SP.ls,2:SP.rs,3:SP.lw,4:SP.rw,5:SP.hp};
const FIVE ={1:[-14,25],2:[14,25],3:[-21,8],4:[21,8],5:[0,29]};
const TRANS={1:[0,42],2:[7,46],3:[-19,40],4:[19,40],5:[-4,37]};
const with_=(base,extra)=>Object.assign({},base,extra);

const SERIES=['All','Rules','Low','Point','5 Out'];

const RULES=[
  ['Overplayed? Backcut.','Step up, plant, go to the rim. Bounce pass on every backdoor.'],
  ['Dribble at you = handoff or backcut.','Defender trailing = come get the handoff. Defender jumping it = backcut. Never stand still.'],
  ['Pass and move.','After you pass, cut or screen. Never stand and watch.'],
  ['Fill the empty spot.','When someone cuts, the next player replaces her.'],
  ['Post feed on the block = cut off the post.','Split, Split Backcut, or Curl.'],
  ['Ball reversal = post flashes high.','Duck in if her defender is behind her. High-post catch = Point.'],
  ['Ball at the high post = read Away or Over.','Away is our base. Ball-side wing denied = backdoor.'],
  ['Every catch faces the rim.','Catch & Shoot / Go / Rip / Pump Fake.'],
  ['Shots we want.','Layups, post catches in the paint, open 3s.'],
  ['Talk.','"Back!" on a backcut, "Hand!" on a handoff.']
];

const PLAYS=[
 {id:'low-transition',series:'Low',stage:1,title:'Transition into Low',sub:'Run, kick it ahead, feed the post',view:'full',
  video:'https://www.youtube.com/watch?v=OtEbuDo6Yac',start:TRANS,ball:'1',
  steps:[
   {cap:'Rim runner (5) sprints straight to the rim and seals on the ball-side block. Wings sprint wide up the sidelines. 1 pushes the ball up the left side; 2 trails.',
    a:[C(5,SP.lb,[-3,16]),C(3,SP.lw,[-21,30]),C(4,SP.rw,[21,30]),D(1,[-8,27]),C(2,SP.rs)]},
   {cap:'1 kicks it ahead to the wing. Every catch faces the rim.',a:[P(1,3)]},
   {cap:'3 feeds the post on the block. 5 seals: wide base, target hand away from her defender.',a:[P(3,5)]}
  ],end:'Ball is in the post. Now cut off the post: Split, Split Backcut or Curl (next plays).'},

 {id:'low-split',series:'Low',stage:1,title:'Low: Split',sub:'Passer screens, cutter pops to the wing',
  video:'https://www.youtube.com/watch?v=7KBun_5cNPc',start:LOW,ball:'3',
  steps:[
   {cap:'3 feeds 5 on the block.',a:[P(3,5)]},
   {cap:'Split: 3 (the passer) runs up and screens for 1.',a:[S(3,[-12,23])]},
   {cap:'1 comes off the screen to the wing. 3 fills the empty slot. 5 reads the cutters first.',a:[C(1,[-20,16],[-14,25.5]),C(3,SP.ls,[-10,26])]},
   {cap:'5 kicks it out to 1 for the catch & shoot.',a:[P(5,1)]}
  ],end:'Never stand after a post feed. The post is the passer.'},

 {id:'low-split-backcut',series:'Low',stage:1,title:'Low: Split Backcut',sub:'Defender jumps the screen? Go backdoor',
  video:'https://www.youtube.com/watch?v=7KBun_5cNPc',start:LOW,ball:'3',
  steps:[
   {cap:'3 feeds 5 on the block.',a:[P(3,5)]},
   {cap:'3 runs up to screen for 1.',a:[S(3,[-12,23])]},
   {cap:'1\'s defender jumps over the top of the screen. 1 plants and backcuts to the rim. Call "Back!" 3 fills the slot.',a:[C(1,[-2,6],[-8,15]),C(3,SP.ls,[-10,26])]},
   {cap:'5 hits the backcut with a bounce pass. Layup.',a:[P(5,1)]}
  ],end:'Split Backcut beats a defender who cheats over the screen.'},

 {id:'low-curl',series:'Low',stage:1,title:'Low: Curl',sub:'Curl tight for the handoff',
  video:'https://www.youtube.com/watch?v=7KBun_5cNPc',start:LOW,ball:'3',
  steps:[
   {cap:'3 feeds 5 on the block.',a:[P(3,5)]},
   {cap:'3 runs up to screen for 1.',a:[S(3,[-12,23])]},
   {cap:'1\'s defender trails the screen. 1 curls tight around it toward 5. 3 fills the slot.',a:[C(1,[-4.5,11],[-16,19]),C(3,SP.ls,[-10,26])]},
   {cap:'5 hands it off. 1 finishes at the rim.',a:[H(5,1)]}
  ],end:'Curl when the defender trails you around the screen.'},

 {id:'low-reversal',series:'Low',stage:2,title:'Low to Point: Reversal',sub:'Swing it, post flashes high',
  video:'https://www.youtube.com/watch?v=F04sPDeFRuw',start:LOW,ball:'3',
  steps:[
   {cap:'No post feed? Swing it. 3 passes back to 1.',a:[P(3,1)]},
   {cap:'1 reverses it to 2. On the reversal, 5 flashes to the high post.',a:[P(1,2),C(5,SP.hp,[-5,13])]},
   {cap:'2 hits 5 at the high post.',a:[P(2,5)]}
  ],end:'High-post catch = POINT. Every reversal turns Low into Point without a call.'},

 {id:'point-away',series:'Point',stage:2,title:'Point Away (Base)',sub:'Pass to the high post, screen away',
  video:'https://www.youtube.com/watch?v=fJxH3z4j49k',start:POINT,ball:'1',
  steps:[
   {cap:'1 passes to 5 at the high post.',a:[P(1,5)]},
   {cap:'AWAY: 1 cuts away and down-screens for 3.',a:[S(1,[-17,15])]},
   {cap:'3 uses the screen and comes up to the slot. 1 pops back out to the wing.',a:[C(3,[-9,26],[-15,20]),C(1,[-20,17],[-19,14])]},
   {cap:'5 passes to 3. Ball is back on top. Keep it moving.',a:[P(5,3)]}
  ],end:'Away is our base. Most common read next: the wing rejects the screen and goes backdoor.'},

 {id:'point-away-reject',series:'Point',stage:2,title:'Point Away: Reject',sub:'Wing rejects the screen, backdoor',
  video:'https://www.youtube.com/watch?v=fJxH3z4j49k',start:POINT,ball:'1',
  steps:[
   {cap:'1 passes to 5 at the high post.',a:[P(1,5)]},
   {cap:'1 cuts away to down-screen for 3.',a:[S(1,[-17,15])]},
   {cap:'3\'s defender cheats over the top to beat the screen. 3 rejects it: plants and backcuts. Call "Back!" 1 pops back to the slot.',a:[C(3,[-3,6],[-13,8]),C(1,SP.ls,[-15,22])]},
   {cap:'5 hits the backdoor with a bounce pass. Layup.',a:[P(5,3)]}
  ],end:'Overplayed = backcut, even off a screen.'},

 {id:'point-over',series:'Point',stage:2,title:'Point Over',sub:'Cut over the top for the handoff',
  video:'https://www.youtube.com/watch?v=YLYJJ7j_HZU',start:POINT,ball:'1',
  steps:[
   {cap:'1 passes to 5 at the high post.',a:[P(1,5)]},

      return g(`<path d="M${f2(p[0])} ${f2(p[1])}L${f2(q[0])} ${f2(q[1])}" stroke-dasharray=".5 .45" marker-end="${mk}"/>`)+`<text x="${f2(m[0])}" y="${f2(m[1]-1.2)}" text-anchor="middle" font-size="1.5" font-weight="700" fill="${col}" opacity="${op}" font-family="system-ui,sans-serif">HAND</text>`;}
    return g(`<path d="M${f2(p[0])} ${f2(p[1])}L${f2(q[0])} ${f2(q[1])}" stroke-dasharray="1 .7" marker-end="${mk}"/>`);
  }
  const A=st.pos[a.p];if(!A)return '';
  const B=a.to;
  if(a.t==='drib'){const [p]=shorten(A,B,1.9,0);return g(`<path d="${zig(p,B)}" marker-end="${mk}"/>`);}
  if(a.t==='screen'){
    const [p]=shorten(A,B,1.9,0),dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1,nx=-dy/L*1.3,ny=dx/L*1.3;
    return g(`<path d="M${f2(p[0])} ${f2(p[1])}L${f2(B[0])} ${f2(B[1])}"/><path d="M${f2(B[0]+nx)} ${f2(B[1]+ny)}L${f2(B[0]-nx)} ${f2(B[1]-ny)}" stroke-width=".42"/>`);
  }
  // cut
  const s=qpt(A,B,a.via,0),start=a.via?shorten(A,a.via,1.9,0)[0]:shorten(A,B,1.9,0)[0];
  const d=a.via?`M${f2(start[0])} ${f2(start[1])}Q${f2(a.via[0])} ${f2(a.via[1])} ${f2(B[0])} ${f2(B[1])}`:`M${f2(start[0])} ${f2(start[1])}L${f2(B[0])} ${f2(B[1])}`;
  void s;
  return g(`<path d="${d}" marker-end="${mk}"/>`);
}
function playerSvg(id,xy,you){
  const x=f2(xy[0]),y=f2(xy[1]);
  if(id[0]==='x'){const r=.95;return `<g stroke="#ffe08a" stroke-width=".42" stroke-linecap="round"><path d="M${f2(xy[0]-r)} ${f2(xy[1]-r)}L${f2(xy[0]+r)} ${f2(xy[1]+r)}M${f2(xy[0]+r)} ${f2(xy[1]-r)}L${f2(xy[0]-r)} ${f2(xy[1]+r)}"/></g>`;}
  return (you?`<circle cx="${x}" cy="${y}" r="2.55" fill="none" stroke="#ff9a3c" stroke-width=".35" class="pulse"/><text x="${x}" y="${f2(xy[1]-3)}" text-anchor="middle" font-size="1.5" font-weight="800" fill="#ff9a3c" font-family="system-ui,sans-serif" letter-spacing=".1">YOU</text>`:'')+
    `<circle cx="${x}" cy="${y}" r="1.75" fill="${you?'#ff9a3c':'#fff'}" stroke="${you?'#fff':'#0f3d28'}" stroke-width=".25"/>`+
    `<text x="${x}" y="${f2(xy[1]+.08)}" text-anchor="middle" dominant-baseline="central" font-size="2.1" font-weight="800" fill="${you?'#1b0d03':'#0f3d28'}" font-family="system-ui,sans-serif">${esc(id)}</text>`;
}
/* f = {view,pos,ball,ballXY,you,arrows:[svg],marks:svg,under:svg} */
function courtSvg(f){
  const ids=Object.keys(f.pos);
  const defs=ids.filter(k=>k[0]==='x').map(k=>playerSvg(k,f.pos[k])).join('');
  const offs=ids.filter(k=>k[0]!=='x').map(k=>playerSvg(k,f.pos[k],k===f.you)).join('');
  let bxy=f.ballXY;if(!bxy&&f.ball&&f.pos[f.ball])bxy=[f.pos[f.ball][0]+BALL_OFF[0],f.pos[f.ball][1]+BALL_OFF[1]];
  const ball=bxy?`<circle cx="${f2(bxy[0])}" cy="${f2(bxy[1])}" r=".85" fill="#ff7a1a" stroke="#5a2600" stroke-width=".15"/>`:'';
  return `<svg class="court" viewBox="${VIEWS[f.view||'half']}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Half-court diagram">${DEFS}${COURT}${f.under||''}${(f.arrows||[]).join('')}${defs}${offs}${ball}${f.marks||''}</svg>`;
}

/* animate one step from st; calls onFrame(frame) and done(en) */
let animId=0;
function animateStep(st,step,draw,done,dur){
  const my=++animId,en=applyStep(st,step),t0=performance.now();dur=dur||1150;
  const pa=step.a.find(a=>a.t==='pass'||a.t==='hand');
  const moves=step.a.filter(a=>a.t==='cut'||a.t==='drib'||a.t==='screen');
  function frame(now){
    if(my!==animId)return;
    const t=Math.min(1,(now-t0)/dur),e=ease(t),pos=copyPos(st.pos);
    moves.forEach(a=>{pos[a.p]=qpt(st.pos[a.p],a.to,a.t==='cut'?a.via:null,e);});
    let ballXY=null,ball=st.ball;
    if(pa){
      const bt=moves.length?clamp((e-.45)/.55,0,1):e;
      const A=pos[pa.f],B=pos[pa.to];
      ballXY=[A[0]+BALL_OFF[0]+(B[0]-A[0])*bt,A[1]+BALL_OFF[1]+(B[1]-A[1])*bt];ball=null;
    }
    draw({pos,ball,ballXY,arrows:step.a.map(a=>arrowSvg(a,st,en,{dim:true}))});
    if(t<1)requestAnimationFrame(frame);else done(en);
  }
  requestAnimationFrame(frame);
}
function animateSeq(st,steps,draw,done,gap){
  let i=0;
  (function next(s){
    if(i>=steps.length){done&&done(s);return;}
    const step=steps[i++];
    animateStep(s,step,draw,en=>{setTimeout(()=>{next(en);},gap==null?250:gap);});
  })(st);
}
function stopAnim(){animId++;}

}

function qFrame(it,extra){

function drawQ(frame){
  const it=curItem(),q=ui.q,el=$('#court');if(!el)return;
  if(frame){el.innerHTML=courtSvg(Object.assign({view:it.view,you:it.you},frame));return;}

function bindTap(el,it){
  const svg=el.querySelector('svg');let down=false;
  const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const r=p.matrixTransform(svg.getScreenCTM().inverse());return [f2(clamp(r.x,-24,24)),f2(clamp(r.y,.5,46.5))];};
  svg.addEventListener('pointerdown',e=>{down=true;svg.setPointerCapture(e.pointerId);ui.q.guess=pt(e);redrawGuess(it);});
  svg.addEventListener('pointermove',e=>{if(!down)return;e.preventDefault();ui.q.guess=pt(e);redrawGuess(it);});
  svg.addEventListener('pointerup',()=>{down=false;});
  svg.addEventListener('pointercancel',()=>{down=false;});
}
function redrawGuess(it){
  const svg=$('#court svg'),q=ui.q;
  const pos=copyPos(it.pos);pos[it.you]=q.guess;
  const tmp=document.createElement('div');
  tmp.innerHTML=courtSvg(qFrame(it,{pos,under:`<circle cx="${it.pos[it.you][0]}" cy="${it.pos[it.you][1]}" r="1.75" fill="none" stroke="rgba(255,255,255,.5)" stroke-width=".2" stroke-dasharray=".5 .4"/>`}));
  svg.innerHTML=tmp.firstChild.innerHTML;
  const b=document.querySelector('[data-act="check"]');if(b)b.disabled=false;
}
function showAnswer(){
  const it=curItem();if(!it.show)return;
  const st={pos:copyPos(it.pos),ball:it.ball};
  const marks=it.kind==='where'?`<circle cx="${it.ans[0]}" cy="${it.ans[1]}" r="${it.tol}" fill="rgba(255,210,90,.18)" stroke="#ffd25a" stroke-width=".3" stroke-dasharray="1 .6"/>`:'';
  animateSeq(st,it.show,f=>drawQ(Object.assign({marks},f)),en=>{
    drawQ({pos:en.pos,ball:en.ball,marks,arrows:[]});
  },350);
}
function record(kind,id,ok){
  const r=store[kind][id]||{tries:0,right:0};r.tries++;if(ok)r.right++;r.last=ok;store[kind][id]=r;save();
  const it=qById(id);
  logEvent(kind,id,it?it.series:'',ok);
}

/* ---------- Tracker: sign-in, offline outbox, team board ---------- */
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const SERIES4=['Rules','Low','Point','5 Out'];
function logEvent(kind,item,series,ok){
  if(!API_URL||!store.player)return;
  store.outbox.push({who:store.player.login,id:newId(),t:Date.now(),kind,item,series,ok});
  if(store.outbox.length>3000)store.outbox=store.outbox.slice(-3000);
  save();flush();
}
let flushing=false;
async function flush(){
  if(!API_URL||flushing||!store.outbox.length||navigator.onLine===false)return;
  flushing=true;
  try{
    const who=store.outbox[0].who,batch=store.outbox.filter(e=>e.who===who).slice(0,200);
    const res=await fetch(API_URL,{method:'POST',body:JSON.stringify({action:'log',who,events:batch.map(e=>({id:e.id,t:e.t,kind:e.kind,item:e.item,series:e.series,ok:e.ok}))})}).then(r=>r.json());
    if(res.ok||res.error==='unknown player'){
      const ids=new Set(batch.map(e=>e.id));store.outbox=store.outbox.filter(e=>!ids.has(e.id));save();
      flushing=false;if(store.outbox.length)flush();return;
    }
  }catch(e){}
  flushing=false;
}
async function apiGet(params){const r=await fetch(API_URL+'?'+new URLSearchParams(params).toString());return r.json();}

function initials(p){const w=String(p.wnba||p.login||p.name||'?').trim().split(/\s+/);return ((w[0]||'')[0]||'')+(w.length>1?(w[w.length-1][0]||''):'');}
function avatar(p,size){
  const s=size||40,ini=`<span class="av ini" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.38)}px${p.photo?';display:none':''}">${esc(initials(p).toUpperCase())}</span>`;
  if(!p.photo)return ini;
  return `<img class="av" src="${esc(p.photo)}" alt="" width="${s}" height="${s}" style="width:${s}px;height:${s}px" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`+ini;
}

const signin={msg:'',found:null,busy:false};
function signInView(){
  if(signin.found){const f=signin.found;
    return `<div class="card signin">${avatar({wnba:f.login,photo:f.photo},76)}<h2>Welcome, ${esc(f.name)}!</h2>
      <p class="muted">You're playing as <b>${esc(f.login)}</b>.</p>
      <button class="btn primary block" data-act="si-yes">Yes, that's me</button>
      <button class="btn block" data-act="si-no" style="margin-top:8px">No, that's not me</button></div>`;}
  return `<div class="card signin"><img src="logo-mark.png" alt="" width="84" height="84" onerror="this.remove()">
    <h2>Sign in</h2><p class="muted">Type the name of the WNBA player Coach gave you.</p>
    <form data-form="signin"><label class="sr" for="si-who">Your WNBA player</label>
      <input id="si-who" name="who" class="inp" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="e.g. Angel Reese" required>
      <button class="btn primary block" type="submit" ${signin.busy?'disabled':''}>${signin.busy?'Checking…':'Sign in'}</button></form>
    ${signin.msg?`<p class="err" role="alert">${esc(signin.msg)}</p>`:''}
    <p class="muted small" style="margin:14px 0 0">Don't know your player? Ask Coach.</p></div>`;
}

function mastered(series,plays,last){
  const pl=PLAYS.filter(p=>p.series===series),qs=READS.concat(WHERE).filter(x=>x.series===series);
  return pl.every(p=>plays.indexOf(p.id)>=0)&&qs.every(x=>last[x.id]===1);
}
function myBadge(series){
  const plays=Object.keys(store.plays).filter(k=>store.plays[k]),last={};
  ['reads','where'].forEach(k=>{for(const id in store[k])last[id]=store[k][id].last?1:0;});
  return mastered(series,plays,last);
}
function badgesHtml(has){return `<span class="bdgs">${SERIES4.map(s=>`<span class="bdg${has(s)?' on':''}" title="${esc(s)}${has(s)?' mastered':''}">${esc(s==='5 Out'?'5 OUT':s.toUpperCase())}</span>`).join('')}</span>`;}
function isMe(p){return !!store.player&&String(p.wnba||'').toLowerCase()===String(store.player.login).toLowerCase();}
function nameOf(p){return esc(p.name)+(p.number?` <span class="muted">#${esc(p.number)}</span>`:'');}
function parseLocalDate(s){const p=String(s||'').split('-').map(Number);if(p.length<3)return '';return new Date(p[0],p[1]-1,p[2]).toLocaleDateString([],{month:'short',day:'numeric'});}

let boardBusy=false;
async function loadBoard(force){
  if(!API_URL||!store.player||boardBusy||navigator.onLine===false)return;
  if(!force&&store.board&&Date.now()-store.board.at<60000)return;
  boardBusy=true;
  try{const r=await apiGet({action:'board',who:store.player.login});
    if(r.ok){store.board={at:Date.now(),week:r.week,players:r.players,focus:r.focus||''};save();boardBusy=false;if(!ui.coach&&(store.tab==='team'||(store.tab==='home'&&ui.nav.view==='home')))render(true);return;}
  }catch(e){}
  boardBusy=false;
}
function boardHtml(){
  const b=store.board;
  if(!b)return `<div class="card"><h3>This week's reps</h3><p class="muted" style="margin:6px 0 0">${navigator.onLine===false?'Connect to see the team board.':'Loading the team board…'}</p></div>`;
  const ps=b.players.slice(),active=ps.filter(p=>p.reps>0).sort((a,c)=>c.reps-a.reps||a.name.localeCompare(c.name)),max=active.length?active[0].reps:1;
  const idle=ps.length-active.length;
  let out=`<div class="card"><div class="row spread"><h3>This week's reps</h3><span class="muted small">since Mon ${parseLocalDate(b.week)}</span></div>
    <p class="muted small" style="margin:4px 0 10px">Every quiz answer is a rep. Resets every Monday.</p>`;
  out+=active.length?`<ol class="lb">${active.map((p,i)=>`<li class="${isMe(p)?'me':''}"><span class="rk">${i+1}</span>${avatar(p,38)}<span class="nm"><b>${nameOf(p)}</b><span class="muted small">${esc(p.wnba)}</span><span class="bar thin"><span style="width:${Math.max(4,p.reps/max*100)}%"></span></span></span><span class="rp">${p.reps}</span></li>`).join('')}</ol>`
    :'<p class="muted">No reps yet this week. Be the first.</p>';
  if(idle&&active.length)out+=`<p class="muted small" style="margin:10px 0 0">${idle} teammate${idle>1?'s haven\'t':' hasn\'t'} started this week.</p>`;
  out+='</div>';
  const withB=ps.map(p=>{const has=s=>mastered(s,p.plays||[],p.last||{});return {p,has,n:SERIES4.filter(has).length};})
    .sort((a,c)=>c.n-a.n||a.p.name.localeCompare(c.p.name));
  out+=`<div class="card"><h3>Badges</h3><p class="muted small" style="margin:4px 0 10px">Earn a badge by watching every play in a series and getting every question in it right.</p>
    <ul class="lb bd">${withB.map(x=>`<li class="${isMe(x.p)?'me':''}">${avatar(x.p,34)}<span class="nm"><b>${nameOf(x.p)}</b></span>${badgesHtml(x.has)}</li>`).join('')}</ul>
    <p class="muted small" style="margin:10px 0 0">Updated ${new Date(b.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}. <button class="link" data-act="board-refresh">Refresh</button></p></div>`;
  return out;
}

function teamView(){
  if(ui.coach)return coachView();
  let out='';
  if(API_URL){
    if(store.player){
      const pend=store.outbox.length;
      out+=`<div class="card row" style="gap:12px">${avatar({wnba:store.player.login,photo:store.player.photo},52)}<div style="flex:1;min-width:0"><div class="t">${esc(store.player.name)}</div><div class="muted small">Playing as ${esc(store.player.login)}</div>${pend?`<div class="small" style="color:var(--warn)">${pend} answer${pend>1?'s':''} will send when you have signal</div>`:''}</div><button class="link" data-act="switch">Switch</button></div>`;
      out+=boardHtml();
    }else out+=`<div class="card"><h3>Join the team board</h3><p class="muted" style="margin:6px 0 12px">Sign in with your WNBA player to show up on the reps board and earn badges.</p><button class="btn primary" data-act="si-start">Sign in</button></div>`;
  }
  out+=`<div class="card"><h3>My badges</h3><div style="margin-top:10px">${badgesHtml(myBadge)}</div></div>`;
  out+=myProgressHtml();
  out+=`<details class="card"><summary><h3>Put it on your home screen</h3></summary>
   <p style="margin:0 0 8px"><b>iPhone (Safari):</b> tap the Share button, then <b>Add to Home Screen</b>.</p>
   <p style="margin:0"><b>Android (Chrome):</b> tap ⋮, then <b>Add to Home screen</b> or <b>Install app</b>.</p>
   <p class="muted small" style="margin:8px 0 0">Open it once with internet, and after that it works with no signal.</p></details>
  <button class="btn block" data-act="reset" style="margin-top:4px">Reset my progress on this phone</button>
  ${API_URL?'<p style="text-align:center;margin:18px 0 0"><button class="link small" data-act="coach-open">Coach view</button></p>':''}`;
  return out;
}
function myProgressHtml(){
  return `<h3 style="margin:18px 0 8px">My progress</h3>`+SERIES4.map(s=>{
    const pl=PLAYS.filter(p=>p.series===s),rd=READS.filter(x=>x.series===s),wh=WHERE.filter(x=>x.series===s);
    const seen=pl.filter(p=>store.plays[p.id]).length,r=rd.filter(x=>store.reads[x.id]&&store.reads[x.id].last).length,w=wh.filter(x=>store.where[x.id]&&store.where[x.id].last).length;
    const tot=pl.length+rd.length+wh.length,got=seen+r+w;
    return `<div class="card"><div class="row spread"><h3>${esc(s)}</h3><span class="pill${got===tot&&tot?' good':''}">${got===tot&&tot?'Mastered':Math.round(tot?got/tot*100:0)+'%'}</span></div>
      <div class="bar" style="margin-top:10px"><span style="width:${tot?got/tot*100:0}%"></span></div>
      <div class="stat small muted">${pl.length?`<div class="row spread"><span>Plays watched</span><span>${seen} / ${pl.length}</span></div>`:''}
      ${rd.length?`<div class="row spread"><span>Reads right</span><span>${r} / ${rd.length}</span></div>`:''}
      ${wh.length?`<div class="row spread"><span>Spots right</span><span>${w} / ${wh.length}</span></div>`:''}</div></div>`;
  }).join('');
}

/* ---------- Coach view ---------- */
async function loadCoach(){
  ui.coachBusy=true;ui.coachErr='';render(true);
  try{const r=await apiGet({action:'coach',key:store.coachKey});
    if(r.ok){ui.coachData=r;}else{ui.coachErr='That coach key didn\'t work.';store.coachKey='';save();}
  }catch(e){ui.coachErr='Couldn\'t reach the sheet. Check your signal.';}
  ui.coachBusy=false;render(true);
}
function coachView(){
  let out=`<button class="back" data-act="coach-close">‹ Team</button><h2 style="margin-bottom:10px">Coach view</h2>`;
  if(!store.coachKey)return out+`<div class="card"><p class="muted" style="margin:0 0 10px">Enter the coach key from the Settings tab of your tracker sheet.</p>
    <form data-form="coachkey"><input class="inp" name="key" inputmode="numeric" autocomplete="off" placeholder="Coach key" required><button class="btn primary block" type="submit" style="margin-top:10px">Open</button></form>
    ${ui.coachErr?`<p class="err">${esc(ui.coachErr)}</p>`:''}</div>`;
  const d=ui.coachData;
  if(!d)return out+`<p class="muted">${ui.coachBusy?'Loading…':esc(ui.coachErr||'')}</p>`;
  const ps=d.players.slice().sort((a,c)=>c.reps-a.reps||c.total-a.total||a.name.localeCompare(c.name));
  const on=ps.filter(p=>p.reps>0).length;
  out+=`<div class="card"><div class="row spread"><h3>This week</h3><span class="muted small">since Mon ${parseLocalDate(d.week)}</span></div>
    <p style="margin:6px 0 10px"><b>${on} of ${ps.length}</b> players have practiced this week.</p>
    <div class="tbl"><table><thead><tr><th>Player</th><th>Week</th><th>All</th><th>Last on</th><th>Badges</th></tr></thead><tbody>
    ${ps.map(p=>{const n=SERIES4.filter(s=>mastered(s,p.plays||[],p.last||{})).length;
      return `<tr><td><b>${esc(p.name)}</b><br><span class="muted small">${esc(p.wnba)}</span></td><td>${p.reps}</td><td>${p.total}</td><td class="small">${p.lastActive?parseLocalDate(p.lastActive):'<span class="muted">never</span>'}</td><td>${n}/4</td></tr>`;}).join('')}
    </tbody></table></div></div>`;
  const all=READS.concat(WHERE),miss=Object.keys(d.items).map(id=>({id,it:d.items[id],q:all.find(x=>x.id===id)})).filter(x=>x.q&&x.it.tries>=3)
    .sort((a,c)=>c.it.wrong/c.it.tries-a.it.wrong/a.it.tries).slice(0,8);
  out+=`<div class="card"><h3>Most-missed questions</h3><p class="muted small" style="margin:4px 0 10px">Every try counts; shows questions with 3+ tries. Re-teach these at practice.</p>
    ${miss.length?`<ol class="rules">${miss.map(x=>`<li><b>${Math.round(x.it.wrong/x.it.tries*100)}% missed</b> <span class="muted small">(${x.it.tries} tries · ${esc(x.q.series)})</span><br>${esc(x.q.sit?x.q.sit+' ':'')}${esc(x.q.q)}</li>`).join('')}</ol>`:'<p class="muted">Not enough answers yet.</p>'}</div>
  <div class="row"><button class="btn" data-act="coach-refresh">↻ Refresh</button><button class="link" data-act="coach-forget" style="margin-left:auto">Forget coach key</button></div>`;
  return out;
}

/* ---------- forms ---------- */
document.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  if(f.dataset.form==='signin'){
    const who=f.who.value.trim();if(!who)return;
    if(navigator.onLine===false){signin.msg='You need signal the first time you sign in.';render();return;}
    signin.busy=true;signin.msg='';render();
    try{const r=await apiGet({action:'login',who});
      if(r.ok)signin.found={login:r.login,name:r.name,number:r.number,photo:r.photo};else signin.msg=r.error||'That name didn\'t match.';
    }catch(err){signin.msg='Couldn\'t reach the team list. Check your signal and try again.';}
    signin.busy=false;render();
    if(!signin.found){const i=$('#si-who');if(i){i.value=who;i.focus();}}
  }else if(f.dataset.form==='coachkey'){
    store.coachKey=f.key.value.trim();save();loadCoach();
  }
});
window.addEventListener('online',()=>{flush();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')flush();});

/* ---------- events ---------- */
function navBack(){
  const n=ui.nav;
  if(n.view==='play'){const p=curPlay();ui.play=null;go({view:'series',series:p.series});}
  else if(n.view==='quiz'){ui.q=null;go(n.back||{view:'home'});}
  else if(n.view==='series'){const c=catOf(n.series);go({view:'cat',cat:c.id});}
  else go({view:'home'});
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,k=b.dataset.k;
  if(act==='tab'){
    if(store.tab===k&&k==='home'){ui.play=null;ui.q=null;ui.nav={view:'home'};}
    store.tab=k;ui.coach=false;save();render();
  }
  else if(act==='nav-back'){navBack();}
  else if(act==='open-cat'){go({view:'cat',cat:k});}
  else if(act==='open-series'){go({view:'series',series:k});}
  else if(act==='open-play'){ui.play=b.dataset.id;ui.step=0;go({view:'play'});}
  else if(act==='step-back'){stopAnim();ui.step=Math.max(0,ui.step-1);render();}
  else if(act==='step-next'||act==='play-all'){
    const p=curPlay();stopAnim();
    if(ui.step>=p.steps.length){ui.step=0;}
    const runOne=()=>{
      const st=stateAt(p,ui.step);
      animateStep(st,p.steps[ui.step],f=>drawPlay(f),()=>{
        ui.step++;
        if(ui.step>=p.steps.length)markViewed(p);
        const keep=ui.play;render(true);
        if(act==='play-all'&&keep===ui.play&&ui.step<p.steps.length)setTimeout(()=>{if(ui.play===keep&&ui.nav.view==='play')runOne();},500);
      });
    };
    if(act==='step-next'&&b.textContent.indexOf('Replay')>=0){render(true);return;}
    runOne();
  }
  else if(act==='daily'){const ids=dailyIds();if(ids.length)startQuiz(ids,'Daily 5',{view:'home'});}
  else if(act==='series-quiz'){const s=ui.nav.series;startQuiz(shuffle(QUIZ.filter(x=>x.series===s).map(x=>x.id)),s+' quiz',{view:'series',series:s});}
  else if(act==='quiz-again'){const q=ui.q;
    if(q.label==='Daily 5')startQuiz(dailyIds(),'Daily 5',q.back);else startQuiz(shuffle(q.items),q.label,q.back);}
  else if(act==='retry-missed'){const q=ui.q;startQuiz(q.missed.slice(),q.label,q.back);}
  else if(act==='quit'){navBack();}
  else if(act==='choose'){
    const q=ui.q,it=curItem();if(q.answered)return;
    q.answered=true;q.choice=Number(k);const ok=!!it.choices[q.choice].ok;
    if(ok)q.right++;else q.missed.push(it.id);record('reads',it.id,ok);
    render(true);showAnswer();
  }
  else if(act==='check'){
    const q=ui.q,it=curItem();if(!q.guess||q.answered)return;
    const d=Math.hypot(q.guess[0]-it.ans[0],q.guess[1]-it.ans[1]);
    q.answered=true;q.ok=d<=it.tol;if(q.ok)q.right++;else q.missed.push(it.id);record('where',it.id,q.ok);
    render(true);setTimeout(showAnswer,700);
  }
  else if(act==='replay-show'){stopAnim();drawQ();setTimeout(showAnswer,300);}
  else if(act==='next-q'){
    const q=ui.q;q.i++;q.answered=false;q.choice=null;q.guess=null;q.order=null;q.ok=null;
    if(q.i>=q.items.length)q.done=true;render();
  }
  else if(act==='si-yes'){store.player=signin.found;signin.found=null;signin.msg='';store.board=null;store.tab='home';ui.nav={view:'home'};save();render();}
  else if(act==='si-no'){signin.found=null;signin.msg='';render();}
  else if(act==='switch'){
    if(confirm("Switch player? This phone's progress will be cleared. Your answers are already saved to the team board.")){
      flush();store.player=null;store.plays={};store.reads={};store.where={};store.board=null;ui.nav={view:'home'};save();render();}
  }
  else if(act==='board-refresh'){loadBoard(true);}
  else if(act==='coach-open'){ui.coach=true;render();if(store.coachKey)loadCoach();}
  else if(act==='coach-close'){ui.coach=false;render();}
  else if(act==='coach-refresh'){loadCoach();}
  else if(act==='coach-forget'){store.coachKey='';ui.coachData=null;save();render();}
  else if(act==='reset'){
    if(confirm('Reset your progress on this phone?')){store.plays={};store.reads={};store.where={};save();render();}
  }
});

render();
flush();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
</script>
